<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GANG2K | Streetwear Y2K & Underground</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ==========================================================================
           1. VARIÁVEIS DE DESIGN & RESET (Paleta: Vermelho & Creme)
           ========================================================================== */
        :root {
            --bg-creme: #fdfbf7;
            --creme-escuro: #f3ece0;
            --vermelho-principal: #8b0000;
            --vermelho-hover: #b22222;
            --texto-escuro: #1a1717;
            --texto-suave: #5c554e;
            --borda-creme: #e6decb;
            --sombra-soft: 0 8px 24px rgba(139, 0, 0, 0.08);
            --sombra-card: 0 10px 20px rgba(0, 0, 0, 0.05);
            --fonte-principal: 'Impact', 'Arial Black', sans-serif;
            --fonte-corpo: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--fonte-corpo);
        }

        body {
            background-color: var(--bg-creme);
            color: var(--texto-escuro);
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ==========================================================================
           2. HEADER & NAVEGAÇÃO
           ========================================================================== */
        header {
            background-color: var(--bg-creme);
            border-bottom: 3px solid var(--vermelho-principal);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--sombra-soft);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: var(--fonte-principal);
            font-size: 2.2rem;
            color: var(--vermelho-principal);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px var(--creme-escuro);
        }

        .logo span {
            color: var(--texto-escuro);
        }

        /* Busca */
        .search-box {
            position: relative;
            flex-grow: 0.4;
        }

        .search-box input {
            width: 100%;
            padding: 0.6rem 1rem 0.6rem 2.5rem;
            background-color: var(--creme-escuro);
            border: 2px solid var(--borda-creme);
            border-radius: 25px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--vermelho-principal);
            background-color: #fff;
        }

        .search-box i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--vermelho-principal);
        }

        /* Ícones de Ação */
        .header-actions {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .cart-icon-btn {
            position: relative;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--vermelho-principal);
            cursor: pointer;
        }

        .cart-badge {
            position: absolute;
            top: -8px;
            right: -10px;
            background-color: var(--vermelho-principal);
            color: var(--bg-creme);
            font-size: 0.75rem;
            font-weight: bold;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* NAV CATEGORIAS */
        nav {
            background-color: var(--creme-escuro);
            border-bottom: 1px solid var(--borda-creme);
        }

        .nav-links {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            list-style: none;
            gap: 2rem;
            padding: 0.8rem;
        }

        .nav-links button {
            background: none;
            border: none;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--texto-escuro);
            cursor: pointer;
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .nav-links button.active,
        .nav-links button:hover {
            background-color: var(--vermelho-principal);
            color: var(--bg-creme);
        }

        /* ==========================================================================
           3. HERO BANNER
           ========================================================================== */
        .hero {
            background: linear-gradient(135deg, var(--creme-escuro) 0%, var(--bg-creme) 100%);
            padding: 4rem 2rem;
            text-align: center;
            border-bottom: 1px solid var(--borda-creme);
        }

        .hero h1 {
            font-family: var(--fonte-principal);
            font-size: 3.5rem;
            color: var(--vermelho-principal);
            letter-spacing: 3px;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--texto-suave);
            max-width: 600px;
            margin: 0 auto;
            font-weight: 600;
        }

        /* ==========================================================================
           4. GRID DE PRODUTOS
           ========================================================================== */
        .container {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2.5rem;
        }

        .product-card {
            background-color: #fff;
            border: 2px solid var(--borda-creme);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--sombra-card);
            border-color: var(--vermelho-principal);
        }

        .product-img-wrapper {
            position: relative;
            width: 100%;
            height: 320px;
            background-color: var(--creme-escuro);
            overflow: hidden;
            cursor: pointer;
        }

        .product-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-img-wrapper img {
            transform: scale(1.05);
        }

        .product-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: var(--vermelho-principal);
            color: #fff;
            padding: 0.2rem 0.6rem;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 3px;
        }

        .product-info {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--texto-escuro);
            cursor: pointer;
        }

        .product-title:hover {
            color: var(--vermelho-principal);
        }

        .product-price {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--vermelho-principal);
            margin-bottom: 1rem;
        }

        .card-actions {
            margin-top: auto;
            display: flex;
            gap: 0.5rem;
        }

        .btn-add-cart {
            flex-grow: 1;
            background-color: var(--vermelho-principal);
            color: var(--bg-creme);
            border: none;
            padding: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-add-cart:hover {
            background-color: var(--vermelho-hover);
        }

        .btn-details {
            background-color: var(--creme-escuro);
            color: var(--texto-escuro);
            border: 1px solid var(--borda-creme);
            padding: 0.8rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .btn-details:hover {
            background-color: var(--borda-creme);
        }

        /* Sem resultados */
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem;
            color: var(--texto-suave);
            font-size: 1.2rem;
        }

        /* ==========================================================================
           5. CARRINHO LATERAL (DRAWER)
           ========================================================================== */
        .cart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .cart-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .cart-drawer {
            position: fixed;
            top: 0;
            right: -400px;
            width: 100%;
            max-width: 400px;
            height: 100%;
            background-color: var(--bg-creme);
            z-index: 201;
            box-shadow: -5px 0 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            transition: right 0.3s ease;
        }

        .cart-drawer.active {
            right: 0;
        }

        .cart-header {
            padding: 1.5rem;
            background-color: var(--creme-escuro);
            border-bottom: 2px solid var(--vermelho-principal);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-header h2 {
            font-family: var(--fonte-principal);
            color: var(--vermelho-principal);
            letter-spacing: 1px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--texto-escuro);
            cursor: pointer;
        }

        .cart-body {
            padding: 1.5rem;
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .cart-item {
            display: flex;
            gap: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--borda-creme);
            align-items: center;
        }

        .cart-item img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid var(--borda-creme);
        }

        .cart-item-details {
            flex-grow: 1;
        }

        .cart-item-title {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .cart-item-price {
            color: var(--vermelho-principal);
            font-weight: bold;
            margin-top: 0.2rem;
        }

        .cart-item-remove {
            background: none;
            border: none;
            color: #a00;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .cart-footer {
            padding: 1.5rem;
            background-color: var(--creme-escuro);
            border-top: 1px solid var(--borda-creme);
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }

        .btn-checkout {
            width: 100%;
            background-color: var(--vermelho-principal);
            color: var(--bg-creme);
            border: none;
            padding: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.2s ease;
        }

        .btn-checkout:hover {
            background-color: var(--vermelho-hover);
        }

        /* ==========================================================================
           6. MODAL DE DETALHES DO PRODUTO
           ========================================================================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 300;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background-color: var(--bg-creme);
            width: 100%;
            max-width: 800px;
            border-radius: 8px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1fr;
            position: relative;
            border: 2px solid var(--vermelho-principal);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            font-size: 1.8rem;
            color: var(--texto-escuro);
            cursor: pointer;
            z-index: 10;
        }

        .modal-img {
            width: 100%;
            height: 100%;
            min-height: 350px;
            object-fit: cover;
            background-color: var(--creme-escuro);
        }

        .modal-info {
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .modal-title {
            font-family: var(--fonte-principal);
            font-size: 2rem;
            color: var(--texto-escuro);
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .modal-price {
            font-size: 1.5rem;
            color: var(--vermelho-principal);
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .modal-desc {
            color: var(--texto-suave);
            line-height: 1.6;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        /* ==========================================================================
           7. FOOTER
           ========================================================================== */
        footer {
            background-color: var(--texto-escuro);
            color: var(--bg-creme);
            text-align: center;
            padding: 2rem;
            margin-top: 4rem;
            border-top: 4px solid var(--vermelho-principal);
        }

        footer p {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        /* RESPONSIVIDADE */
        @media (max-width: 768px) {
            .header-container {
                flex-direction: column;
                gap: 1rem;
            }
            .search-box {
                width: 100%;
            }
            .modal-content {
                grid-template-columns: 1fr;
                max-height: 90vh;
                overflow-y: auto;
            }
            .modal-img {
                height: 250px;
            }
            .hero h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo">GANG<span>2K</span></div>
            
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Pesquisar por estilo, produto...">
            </div>

            <div class="header-actions">
                <button class="cart-icon-btn" id="openCartBtn" aria-label="Ver Carrinho">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="cart-badge" id="cartCount">0</span>
                </button>
            </div>
        </div>

        <nav>
            <ul class="nav-links">
                <li><button class="nav-btn active" data-category="todos">Todos</button></li>
                <li><button class="nav-btn" data-category="camisetas">Camisetas</button></li>
                <li><button class="nav-btn" data-category="calcas">Calças</button></li>
                <li><button class="nav-btn" data-category="sapatos">Sapatos</button></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <h1>Drop Anos 2000</h1>
        <p>A verdadeira estética Streetwear & Gangster Gothic Y2K. Estoque limitado.</p>
    </section>

    <main class="container">
        <div class="products-grid" id="productsGrid">
            </div>
    </main>

    <div class="cart-overlay" id="cartOverlay"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h2>Seu Carrinho</h2>
            <button class="close-btn" id="closeCartBtn">&times;</button>
        </div>
        <div class="cart-body" id="cartItemsContainer">
            </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cartTotalValue">R$ 0,00</span>
            </div>
            <button class="btn-checkout" onclick="checkout()">Finalizar Compra</button>
        </div>
    </div>

    <div class="modal-overlay" id="productModal">
        <div class="modal-content">
            <button class="modal-close" id="closeModalBtn">&times;</button>
            <img src="" alt="Produto" class="modal-img" id="modalImg">
            <div class="modal-info">
                <h2 class="modal-title" id="modalTitle">Nome do Produto</h2>
                <div class="modal-price" id="modalPrice">R$ 0,00</div>
                <p class="modal-desc" id="modalDesc">Descrição do produto...</p>
                <button class="btn-add-cart" id="modalAddCartBtn">
                    <i class="fa-solid fa-bag-shopping"></i> Adicionar ao Carrinho
                </button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2000 GANG2K Streetwear Inc. Todos os direitos reservados.</p>
    </footer>

    <script>
        // BD Local com as imagens enviadas
        const products = [
            {
                id: 1,
                name: "Camiseta Affliction Gothic Oversized 2000s",
                category: "camisetas",
                price: 189.90,
                image: "90s Affliction Hip Hop Skull Graphic T Shirts Men Streetwear Goth Tops Casual Gothic Oversized Long.jpg",
                description: "Camiseta estilo Y2K / Affliction vintage dos anos 2000. Estampa completa em silk de altíssima qualidade com temática gothic/hip-hop, asas, águias e correntes. Modelagem oversized com lavagem envelhecida única."
            },
            {
                id: 2,
                name: "Tênis Bape Sta Low Grey Camo Limited Edition",
                category: "sapatos",
                price: 649.90,
                image: "download (10).jpg",
                imageAlt: "Bape Sta Sneakers",
                description: "O clássico ícone do Hip-Hop dos anos 2000. O Bape Sta em edição tons de cinza/creme traz o icônico monograma em relevo Camo, estrela lateral em couro preto e o clássico pingente metálico nos cadarços."
            },
            {
                id: 3,
                name: "Calça Jeans Baggy Flame Tribal Vintage",
                category: "calcas",
                price: 299.90,
                image: "thrift or pass google form.jpg",
                description: "Calça Jeans Baggy no verdadeiro corte gangster dos anos 2000. Possui lavagem acid wash com bordados tribais e de chamas nas laterais nas cores prata e vinho. Caimento bem amplo e estruturado."
            }
        ];

        // Estado do Carrinho
        let cart = [];
        let currentFilter = 'todos';
        let searchQuery = '';

        // Elementos DOM
        const productsGrid = document.getElementById('productsGrid');
        const searchInput = document.getElementById('searchInput');
        const navBtns = document.querySelectorAll('.nav-btn');
        
        const cartDrawer = document.getElementById('cartDrawer');
        const cartOverlay = document.getElementById('cartOverlay');
        const openCartBtn = document.getElementById('openCartBtn');
        const closeCartBtn = document.getElementById('closeCartBtn');
        const cartItemsContainer = document.getElementById('cartItemsContainer');
        const cartCount = document.getElementById('cartCount');
        const cartTotalValue = document.getElementById('cartTotalValue');

        const productModal = document.getElementById('productModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const modalImg = document.getElementById('modalImg');
        const modalTitle = document.getElementById('modalTitle');
        const modalPrice = document.getElementById('modalPrice');
        const modalDesc = document.getElementById('modalDesc');
        const modalAddCartBtn = document.getElementById('modalAddCartBtn');

        // Renderizar Produtos
        function renderProducts() {
            productsGrid.innerHTML = '';

            const filteredProducts = products.filter(product => {
                const matchesCategory = currentFilter === 'todos' || product.category === currentFilter;
                const matchesSearch = product.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      product.description.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            if (filteredProducts.length === 0) {
                productsGrid.innerHTML = `<div class="no-results">Nenhum produto encontrado no Drop.</div>`;
                return;
            }

            filteredProducts.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-img-wrapper" onclick="openModal(${product.id})">
                        <span class="product-tag">${product.category}</span>
                        <img src="${product.image}" alt="${product.name}">
                    </div>
                    <div class="product-info">
                        <div class="product-title" onclick="openModal(${product.id})">${product.name}</div>
                        <div class="product-price">R$ ${product.price.toFixed(2).replace('.', ',')}</div>
                        <div class="card-actions">
                            <button class="btn-add-cart" onclick="addToCart(${product.id})">
                                <i class="fa-solid fa-plus"></i> Adicionar
                            </button>
                            <button class="btn-details" onclick="openModal(${product.id})" aria-label="Ver Detalhes">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                    </div>
                `;
                productsGrid.appendChild(card);
            });
        }

        // Filtros de Categoria
        navBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                navBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.getAttribute('data-category');
                renderProducts();
            });
        });

        // Evento de Busca
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderProducts();
        });

        // Carrinho
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            updateCartUI();
            toggleCart(true);
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCartUI();
        }

        function updateCartUI() {
            // Contagem
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartCount.textContent = totalItems;

            // Renderizar itens
            cartItemsContainer.innerHTML = '';
            
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p style="text-align: center; color: var(--texto-suave);">Seu carrinho está vazio.</p>';
            } else {
                cart.forEach(item => {
                    const itemEl = document.createElement('div');
                    itemEl.className = 'cart-item';
                    itemEl.innerHTML = `
                        <img src="${item.image}" alt="${item.name}">
                        <div class="cart-item-details">
                            <div class="cart-item-title">${item.name}</div>
                            <div class="cart-item-price">Qty: ${item.quantity} x R$ ${item.price.toFixed(2).replace('.', ',')}</div>
                        </div>
                        <button class="cart-item-remove" onclick="removeFromCart(${item.id})">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    `;
                    cartItemsContainer.appendChild(itemEl);
                });
            }

            // Valor Total
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            cartTotalValue.textContent = `R$ ${total.toFixed(2).replace('.', ',')}`;
        }

        function toggleCart(open) {
            if (open) {
                cartDrawer.classList.add('active');
                cartOverlay.classList.add('active');
            } else {
                cartDrawer.classList.remove('active');
                cartOverlay.classList.remove('active');
            }
        }

        openCartBtn.addEventListener('click', () => toggleCart(true));
        closeCartBtn.addEventListener('click', () => toggleCart(false));
        cartOverlay.addEventListener('click', () => toggleCart(false));

        // Modal de Produto
        let selectedProductId = null;

        function openModal(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            selectedProductId = product.id;
            modalImg.src = product.image;
            modalTitle.textContent = product.name;
            modalPrice.textContent = `R$ ${product.price.toFixed(2).replace('.', ',')}`;
            modalDesc.textContent = product.description;

            productModal.classList.add('active');
        }

        function closeModal() {
            productModal.classList.remove('active');
        }

        closeModalBtn.addEventListener('click', closeModal);
        productModal.addEventListener('click', (e) => {
            if (e.target === productModal) closeModal();
        });

        modalAddCartBtn.addEventListener('click', () => {
            if (selectedProductId) {
                addToCart(selectedProductId);
                closeModal();
            }
        });

        function checkout() {
            if (cart.length === 0) {
                alert('Adicione ao menos um item ao carrinho para finalizar!');
                return;
            }
            alert('Pedido efetuado com sucesso! A estética 2000s está a caminho.');
            cart = [];
            updateCartUI();
            toggleCart(false);
        }

        // Inicializar aplicação
        renderProducts();
    </script>
</body>
</html>
